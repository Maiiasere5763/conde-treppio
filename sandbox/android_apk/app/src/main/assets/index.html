    function runSandhiLab() {
      const l = (document.getElementById("sandhi-left")?.value || "").trim();
      const r = (document.getElementById("sandhi-right")?.value || "").trim();
      const sandiOnly = joinMorphemesJS(l, r, false);
      const out = joinMorphemesJS(l, r, true);
      const resEl = document.getElementById("sandhi-result");
      if (resEl) {
        const haploTag = (out !== sandiOnly)
          ? ` <span style="font-size:0.78rem;color:var(--text-secondary);">(pré-haplologia: <code>${sandiOnly}</code>)</span>`
          : "";
        resEl.innerHTML = `${l || "∅"} + ${r || "∅"} → <strong style="color:var(--emerald);font-size:1.3rem;">${out}</strong>${haploTag}`;
      }
    }

    function runVerbLab() {
      const root = (document.getElementById("lab-verb-root")?.value || "dur").trim().toLowerCase();
      const el = document.getElementById("verb-lab-result");
      if (!el || !root) return;
      const s1 = root;
      const s2 = root.startsWith("a") ? root : "a" + root;
      const s3 = ("aeiouy".includes(root[0]) ? "od" : "o") + root;
      const s4 = root.startsWith("d") ? "oda'" + root.slice(1) : "od" + s2;

      const rows = [
        ["1. Positivo", s1],
        ["2. Privativo (a-)", s2],
        ["3. Iterativo (o-/od-)", s3],
        ["4. Iter.-Privativo (od-a-)", s4]
      ];

      el.innerHTML = `
        <table class="mini-table">
          <thead>
            <tr><th>Eixo</th><th>Infinitivo</th><th>Pres. 1Sg</th><th>Pass. 1Sg (-ra)</th><th>Fut. 1Sg (-ru)</th><th>Impf. 1Sg (-ba)</th></tr>
          </thead>
          <tbody>
            ${rows.map(([label, st]) => `
              <tr>
                <th>${label}</th>
                <td>${joinMorphemesJS(st, "ur", true)}</td>
                <td>${joinMorphemesJS(joinMorphemesJS(st, "u", false), "m", true)}</td>
                <td>${joinMorphemesJS(joinMorphemesJS(st, "ra", false), "m", true)}</td>
                <td>${joinMorphemesJS(joinMorphemesJS(st, "ru", false), "m", true)}</td>
                <td>${joinMorphemesJS(joinMorphemesJS(st, "ba", false), "m", true)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    // --- ABA XI: PRONÚNCIA & ALFABETO FONÉTICO (IPA + SÂNDI HAPLOLÓGICO) ---
    function handleIpaInput(val) {
      ipaInputText = val || "";
      renderIpaLiveOutput();
    }

    function renderIpaLiveOutput() {
      const outEl = document.getElementById("ipa-live-output");
      if (!outEl) return;
      const text = (ipaInputText || "").trim();
      if (!text) {
        outEl.innerHTML = `<span style="color:var(--text-secondary);">Digite palavras ou frases em Tréppio acima para analisar sílabas, acentuação, haplologia e transcrição IPA.</span>`;
        return;
      }
      const normalized = applyHaplologyTextJS(text);
      const rawWords = text.split(/\s+/).filter(Boolean);
      const analyses = rawWords.map(w => {
        const cleanRaw = w.replace(/[.,;:!?()[\]"“”]/g, "");
        const hap = applyHaplologyJS(cleanRaw);
        return { raw: cleanRaw, hap, meta: analyzeTreppioWord(hap) };
      }).filter(x => x.meta);

      const fullIpa = analyses.map(x => x.meta.ipa.slice(1, -1)).join(" ");
      outEl.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.65rem;margin-bottom:0.85rem;padding:0.85rem 1rem;background:var(--bg-secondary);border-radius:12px;border:1px solid var(--border-gold);">
          <div>
            <div style="font-size:0.78rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.06em;">Transcrição Fonética Contínua (IPA)</div>
            <div style="font-family:var(--font-mono);font-size:1.25rem;color:var(--gold-bright);font-weight:700;margin-top:0.2rem;">[${fullIpa}]</div>
            ${normalized !== text ? `<div style="font-size:0.84rem;color:var(--emerald);margin-top:0.25rem;">Forma com apóstrofo: <strong>${normalized}</strong></div>` : ""}
          </div>
          <div class="card-micro-actions">
            <button class="btn btn-gold" data-action="speak" data-arg="${escapeHtmlAttr(normalized)}">${ICON_SPEAK} Ouvir Pronúncia</button>
            <button class="btn" data-action="copy" data-arg="[${escapeHtmlAttr(fullIpa)}]" data-msg="IPA copiado!">${ICON_COPY} Copiar IPA</button>
          </div>
        </div>
        <div class="cards-grid">
          ${analyses.map(({ raw, hap, meta }) => `
            <div class="entry-card">
              <div class="card-header">
                <div>
                  <span class="lemma-title">${hap}</span>
                  ${raw !== hap ? `<span class="pos-badge badge-noun1" style="margin-left:0.4rem;">antes: ${raw}</span>` : ""}

    function ensurePtTranslatorIndex() {
      if (ptTranslatorIndex) return ptTranslatorIndex;
      const list = [];
      const pushEntry = (treppio, ptRaw, pos, detail, actionType, actionKey, boost = 0) => {
        if (!treppio || !ptRaw) return;
        const ptNorm = stripPtAccents(ptRaw).trim();
        const words = ptNorm.split(/[^a-z0-9]+/).filter(Boolean);
        list.push({
          treppio,
          ptRaw,
          ptNorm,
          words,
          pos,
          detail: detail || "",
          actionType,
          actionKey,
          boost
        });
      };

      PT_FUNCTION_WORDS.forEach(fn => {
        pushEntry(fn.treppio, fn.pt, fn.pos, fn.detail, "part", fn.treppio, 45);
      });

      for (const [lemma, obj] of Object.entries(DB.substantivos || {})) {
        pushEntry(lemma, obj.significado || "", `Substantivo (${obj.declinacao}ª Decl.)`, obj.etimologia || "", "noun", lemma, 10);
      }
      for (const [root, axes] of Object.entries(DB.verbos_quadripartite || {})) {
        for (const [axLabel, axObj] of Object.entries(axes)) {
          const inf = axObj.conjugation["Infinitivo(-ur)"];
          pushEntry(inf, axObj.meaning || "", `Verbo [${axLabel}]`, `Raiz ${root}- | Imp: ${axObj.conjugation["Imperativo(Raiz)"]}`, "verb", root, axLabel.startsWith("1.") ? 12 : 4);
        }
      }
      for (const [adj, obj] of Object.entries(DB.adjetivos || {})) {
        pushEntry(adj, obj.Significado || "", "Adjetivo", `Comp: ${obj["Comparativo"] || "—"} | Sup: ${obj["Superlativo.Sg(-n)"] || "—"}`, "adj", adj, 8);
      }
      for (const [adv, obj] of Object.entries(DB.adverbios || {})) {
        pushEntry(adv, obj.significado || "", `Advérbio (${obj.subclasse || "Modal"})`, obj.etimologia || "", "adv", adv, 6);
      }
      for (const [pKey, pObj] of Object.entries(DB.pronomes || {})) {
        const desc = pObj.esfera ? `${pKey}: ${pObj.esfera}` : pKey;
        const formTxt = pObj.Nom ? pObj.Nom.replace(/\([^)]*\)/g, "").trim() : pKey;
        pushEntry(formTxt, desc, "Pronome", JSON.stringify(pObj).slice(0, 120), "pron", pKey, 15);
      }
      for (const [nKey, nObj] of Object.entries(DB.numerais || {})) {
        pushEntry(`${nObj.cardinal} / ${nObj.ordinal}`, `numero ${nKey} (${nObj.cardinal}, ${nObj.ordinal})`, "Numeral", nObj.compostos || "", "num", nKey, 14);
      }
      for (const [pTok, pObj] of Object.entries(DB.particulas_e_afixos || {})) {
        pushEntry(pTok, pObj.descricao || "", pObj.classe || "Partícula/Afixo", pObj.classe || "", "part", pTok, 18);
      }
      for (const [dTok, dObj] of Object.entries(DB.registro_diacronico_e_variantes || {})) {
        pushEntry(`${dTok} → ${dObj.equivalente_canonico || ""}`, dObj.analise || "", dObj.estatuto || "Variante", dObj.equivalente_canonico || "", "diac", dTok, 2);
      }
      (DB.corpus_canonico || []).forEach((cObj, idx) => {
        pushEntry(cObj.treppio || "", cObj.portugues || "", `Corpus (${cObj.categoria})`, cObj.titulo || `Texto #${idx + 1}`, "grammar", String(idx), 5);
      });

      ptTranslatorIndex = list;
      return ptTranslatorIndex;
    }

    function lookupBestPtTokenCandidates(ptToken, idxList, limit = 12) {
      const q = stripPtAccents(ptToken).trim();
      if (!q) return [];
      const qStem = q.length > 4 ? q.replace(/(s|es|os|as|mente|coes|cao|ado|ada|ar|er|ir)$/, "") : q;
      const scored = [];
      for (const item of idxList) {
        let score = 0;
        const head = (item.ptNorm.split(/[,;(]/)[0] || "").trim();
        if (item.ptNorm === q) score = 140;
        else if (head === q) score = 128;
        else if (head && head.split(/[^a-z0-9]+/).includes(q)) score = 105 - Math.min(20, item.words.length);
        else if (item.words.includes(q)) score = 85 - Math.min(25, item.words.length * 2);
        else if (qStem.length >= 3 && item.words.some(w => w === qStem || w.startsWith(qStem))) score = 62 - Math.min(20, item.words.length);
        else if (q.length >= 3 && item.ptNorm.includes(q)) score = 40;
        if (score > 0) {
          scored.push({ score: score + item.boost, item });
        }
      }
      scored.sort((a, b) => b.score - a.score);
      const seen = new Set();
      const unique = [];
      for (const s of scored) {
        const k = s.item.treppio + "|" + s.item.pos;
        if (seen.has(k)) continue;
        seen.add(k);
        unique.push(s);
        if (unique.length >= limit) break;
      }
      return unique;
    }

    function renderTranslatorResults() {
      const outEl = document.getElementById("translator-results-area");

      const qRaw = (translatorQuery || "").trim();

      if (translatorDirection === "pt-tr") {
        const idxList = ensurePtTranslatorIndex();
        const qNorm = stripPtAccents(qRaw);
        const directPhrase = idxList.filter(it => it.ptNorm === qNorm);
        const tokens = qNorm.split(/\s+/).map(t => t.replace(/[.,;:!?()[\]"“”]/g, "")).filter(Boolean);
        const ptStopSkips = new Set(["o", "os", "um", "uma", "uns", "umas", "com", "por", "pelo", "pela"]);
        const tokenMappings = tokens.map(tok => {
          if (ptStopSkips.has(tok)) return { tok, skip: true, best: null, candidates: [] };
          const cands = lookupBestPtTokenCandidates(tok, idxList, 6);
          return { tok, skip: false, best: cands[0] ? cands[0].item : null, candidates: cands };
        });

              ${tokenMappings.filter(tm => !tm.skip).map(tm => `
                <div class="translator-token-chip ${tm.best ? "known" : "unknown"}" ${tm.best && tm.best.actionType !== "grammar" ? `data-action="jump-entry" data-arg="${escapeHtmlAttr(tm.best.actionType)}" data-arg2="${escapeHtmlAttr(tm.best.actionKey)}"` : ""}>
                  <span style="font-size:0.72rem;color:var(--text-secondary);">${tm.tok}</span>

            ${globalCands.length ? globalCands.map(({ item }) => `
              <article class="entry-card">

                    <span class="lemma-title">${item.treppio}</span>

          const clean = rawTok.replace(/[.,;:!?()[\]"“”]/g, "");

          const hap = applyHaplologyJS(clean);
          let matches = _lookupRevMatches(low);
          if (!matches.length) matches = _lookupRevMatches(hap);
          const ipa = analyzeTreppioWord(hap);
          return { raw: clean, hap, matches, ipa };
        });

        const glossSummary = analysisList.map(a => {
          if (!a.matches.length) return `[${a.raw}?]`;

          <div class="cards-grid">

              <article class="entry-card">

                    <button class="micro-btn" data-action="speak" data-arg="${escapeHtmlAttr(a.hap || a.raw)}" title="Ouvir">${ICON_SPEAK}</button>

      if (e.key === "/" && tag !== "INPUT" && tag !== "TEXTAREA") {

        document.getElementById("omni-input").focus();
      } else if (e.key === "Escape") {
        closeModal();

      const action = el.dataset.action;
      const arg = el.dataset.arg || "";
      const arg2 = el.dataset.arg2 || "";
      const msg = el.dataset.msg || "";
      switch (action) {
        case "speak":
          speakTreppio(arg);
          break;
        case "copy":
          copyToClipboard(arg, msg || undefined);
          break;
        case "open-noun":
          openNounModal(arg);
          break;
        case "jump-entry":
          jumpToEntry(arg, arg2);
          break;
        case "inspect-corpus":
          inspectCorpusWord(arg);
          break;
        case "quick-search":
          quickSearch(arg);
          break;
        case "select-verb":
          selectedVerbRoot = arg;
          renderActiveTab();
          break;
        case "select-letter":
          selectedLetter = arg;
          nounDisplayLimit = 60;
          renderActiveTab();
          break;
        case "select-decl":
          selectedDeclFilter = arg;
          nounDisplayLimit = 60;
          renderActiveTab();
          break;

      }
    }
    if ('speechSynthesis' in window) {
      refreshSpeechVoices();
      window.speechSynthesis.onvoiceschanged = refreshSpeechVoices;
    }

    // Regras fonéticas estritas para motor pt-BR: G=/ɡ/ (guitarra), S=/s/ (sapato), '=[ʔ]
    function toTreppioTtsPtBr(text) {
      return String(text || "")
        .replace(/'/g, " ")
        .replace(/([gG]+)(?=[eéëiíyýEÉËIÍYÝ])/g, "$1u")
        .replace(/([aeiouyáéíóúýäëïöüAEIOUYÁÉÍÓÚÝÄËÏÖÜ])s([aeiouyáéíóúýäëïöüAEIOUYÁÉÍÓÚÝÄËÏÖÜ])/g, "$1ss$2")
        .replace(/([yY])/g, m => (m === "Y" ? "I" : "i"))
        .replace(/ë/g, "ê")
        .replace(/Ë/g, "Ê");
    }

    // Para fallback italiano (it-IT): gh antes de e/i preserva /ɡ/, ss intervocálico preserva /s/
    function toTreppioTtsItIt(text) {
      return String(text || "")
        .replace(/'/g, " ")
        .replace(/([gG]+)(?=[eéëiíyýEÉËIÍYÝ])/g, "$1h")
        .replace(/([aeiouyáéíóúýäëïöüAEIOUYÁÉÍÓÚÝÄËÏÖÜ])s([aeiouyáéíóúýäëïöüAEIOUYÁÉÍÓÚÝÄËÏÖÜ])/g, "$1ss$2")
        .replace(/ë/g, "e");
    }

    function pickPreferredTtsVoice() {
      if (!cachedSpeechVoices.length) refreshSpeechVoices();
      const lower = v => (v.lang || "").toLowerCase();
      return (
        cachedSpeechVoices.find(v => lower(v) === "pt-br") ||
        cachedSpeechVoices.find(v => lower(v).startsWith("pt")) ||
        cachedSpeechVoices.find(v => lower(v).startsWith("it")) ||
        cachedSpeechVoices.find(v => lower(v).startsWith("es")) ||
        null
      );
    }

    function speakTreppio(text) {
      if (!text) return;
      showToast(`Pronunciando: ${text}`);
      // 1º: Ponte Nativa Android WebView (TextToSpeech nativo do sistema Android)
      if (window.AndroidCondeBridge && typeof window.AndroidCondeBridge.speak === "function") {
        try {
          window.AndroidCondeBridge.speak(text);
          return;
        } catch (_) {}
      }
      // 2º: Web Speech API (Desktop / Mobile Browser) — prioriza pt-BR com normalizador estrito G=/ɡ/, S=/s/
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const targetVoice = pickPreferredTtsVoice();
      const useIt = targetVoice && (targetVoice.lang || "").toLowerCase().startsWith("it");
      const spoken = useIt ? toTreppioTtsItIt(text) : toTreppioTtsPtBr(text);
      const utter = new SpeechSynthesisUtterance(spoken);
      utter.lang = targetVoice ? targetVoice.lang : "pt-BR";
      utter.rate = 0.86;
      utter.pitch = 1.0;
      if (targetVoice) utter.voice = targetVoice;
      window.speechSynthesis.speak(utter);
    }

    function copyToClipboard(text, msg) {
      if (!text) return;
      if (window.AndroidCondeBridge && typeof window.AndroidCondeBridge.copy === "function") {
        try {
          window.AndroidCondeBridge.copy(text);
          showToast(msg || `Copiado: ${text}`);
          return;
        } catch (_) {}
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(msg || `Copiado: ${text}`);
        }).catch(() => {
          showToast(msg || `Copiado: ${text}`);
        });
      } else {
        showToast(msg || `Copiado: ${text}`);
      }
    }

    function showToast(msg) {
      let toast = document.getElementById("toast-notification");
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "toast-notification";
        toast.className = "toast-box";
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }
  </script>
