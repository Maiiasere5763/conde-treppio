plugins {
    id 'com.android.application'
}

android {
    namespace 'com.conde.treppio'
    compileSdk 34

    defaultConfig {
        applicationId "com.conde.treppio"
        minSdk 24
        targetSdk 34
        versionCode 84
        versionName "8.4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

