name: Compilar APK Android (Códice Tréppio V8.4)

on:
  push:
    branches: [ main ]
    paths:
      - 'sandbox/**'
      - 'docs/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar e Assinar Codice_Treppio_Conde.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recompilar Léxico e Atualizar Assets do Android
        run: |
          python sandbox/gerador_dicionario_integral_sandbox.py

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Compilar APK Android (assembleRelease)
        working-directory: sandbox/android_apk
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Preparar Artefato APK Final
        run: |
          mkdir -p dist
          find sandbox/android_apk/app/build/outputs/apk -name "*.apk" -exec cp {} dist/Codice_Treppio_Conde.apk \;
          ls -la dist/

      - name: Publicar Artefato de Download (GitHub Actions Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Codice_Treppio_Conde_APK
          path: dist/Codice_Treppio_Conde.apk
          if-no-files-found: error

      - name: Criar ou Atualizar Release no GitHub com o APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.4.0-apk
          name: "Códice Tréppio V8.4 — APK para Android"
          body: |
            ### Códice Lexicográfico Imperial da Língua Tréppia (Era Clássica V8.4)
            - **Arquivo**: `Codice_Treppio_Conde.apk`
            - **Total de Formas**: 246.737 formas flexionadas e derivadas da Matriz Quadripartite com haplogia silábica normativa.
            - **Inventário Filológico**: 2.109 substantivos, 1.768 verbos quadripartites (442 raízes), 446 adjetivos, 1.202 advérbios, Pronúncia & IPA (`G=/ɡ/` guitarra, `S=/s/` sapato), Tradutor Bilíngue (`TR ↔ PT`), GNLT e Diálogos de Ecos.
            - **Design**: Visual Obsidian/Parchment de luxo com tipografia clássica imperial (Cinzel, Playfair Display, Inter, JetBrains Mono).
            - **Compatibilidade**: Android 7.0 até Android 15+.
            - **Offline-First**: Funciona sem internet com sincronização opcional via GitHub / Google Drive.
          files: |
            dist/Codice_Treppio_Conde.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
